    Component:
      title: Component
      type: object
      required:
      - id
      - name
      - image
      - created
      properties:
        id:
          type: string
          description: The unique id of the component
        name:
          type: string
          description: The name of the component
        description:
          type: string
          description: The description of the component
        image:
          $ref: '#/components/schemas/SnapshotImage'
        created:
          type: integer
