  parameters:
    screen_note_id:
      name: note_id
      in: path
      description: Screen note id
      required: true
      schema:
        type: string
        pattern: /^[0-9a-f]{24}$/i
    limit:
      name: limit
      in: query
      description: Pagination limit
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 30
    project_id:
      name: project_id
      in: path
      description: Project id
      required: true
      schema:
        type: string
        pattern: /^[0-9a-f]{24}$/i
    filter_by_section_id:
      name: section_id
      in: query
      description: Filter by section id
      required: false
      schema:
        type: string
        pattern: /^[0-9a-f]{24}$/i
    offset:
      name: offset
      in: query
      description: Pagination offset
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    screen_section_id:
      name: section_id
      in: path
      description: Screen section id
      required: true
      schema:
        type: string
        pattern: /^[0-9a-f]{24}$/i
    screen_annotation_id:
      name: annotation_id
      in: path
      description: Screen annotation id
      required: true
      schema:
        type: string
        pattern: /^[0-9a-f]{24}$/i
    screen_version_id:
      name: version_id
      in: path
      description: Screen version id
      required: true
      schema:
        type: string
        pattern: /^[0-9a-f]{24}$/i
    include_latest_version:
      name: include_latest_version
      in: query
      description: Whether to include the latest version data in the Component object
      required: false
      schema:
        type: boolean
        default: false
    screen_id:
      name: screen_id
      in: path
      description: Screen id
      required: true
      schema:
        type: string
        pattern: /^[0-9a-f]{24}$/i
    screen_comment_id:
      name: comment_id
      in: path
      description: Screen comment id
      required: true
      schema:
        type: string
        pattern: /^[0-9a-f]{24}$/i
    include_linked_styleguides:
      name: include_linked_styleguides
      in: query
      description: Whether to include linked styleguides or not
      required: false
      schema:
        type: boolean
        default: false
    sort_screens:
      name: sort
      in: query
      description: Sort screens by their `section` or their `created` date
      required: false
      schema:
        type: string
        default: created
        enum:
        - section
        - created
    screen_variant_id:
      name: variant_id
      in: path
      description: Screen variant id
      required: true
      schema:
        type: string
        pattern: /^[0-9a-f]{24}$/i
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: /v1/oauth/authorize
          tokenUrl: /v1/oauth/token
          refreshUrl: /v1/oauth/token
          scopes: {}
    PersonalAccessToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
